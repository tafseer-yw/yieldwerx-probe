schemaVersion: 1
probeVersion: 3.1.0
profile: playwright-bdd

paths:
  requirements: docs/requirements
  features: features
  ledgers: docs/qa
  artifacts: .probe/artifacts
  testData: test-data

commands:
  lintCases: npm run probe:lint-gherkin
  generateTests: npm run bddgen
  requirementsCoverage: npm run coverage:req
  lintCode: npm run lint
  typecheck: npm run typecheck
  runTests: npm run test:e2e
  syncCases: npm run sync:cases
  aioCheck: npm run aio:check
  aioWhoami: npm run aio:whoami
  aioFolders: npm run aio:folders
  aioCases: npm run aio:cases
  syncBugs: npm run bug:sync
  uiCheck: npm run ui:check
  uiImpact: npm run ui:impact

  # Security scanning (adapter contract: references/integrations/security-tools.md).
  # PLACEHOLDERS — replace the tool invocations and the URL with this consumer's
  # real ones before use. PROBE never guesses a command: a wrong port here is
  # worse than an absent key, because an absent key is reported unavailable
  # while a wrong one fails in a way that looks like the tool's fault.
  securityDeps: <your dependency scanner, e.g. osv-scanner scan --lockfile package-lock.json>
  securitySast: <your static analyser, e.g. semgrep --config auto --error>
  securityFuzz: <your API fuzzer against this app's OpenAPI document>
integrations:
  caseManagement:
    provider: aio
    required: false
  ci:
    provider: azure-pipelines
  browser:
    provider: playwright-mcp
  knowledge:
    provider: yieldwerx-knowledgebase
    required: true
    source: claude-plugin
    marketplace: yieldwerx-company
    plugin: yieldwerx-knowledgebase
    skill: ask-yieldwerx
    revision: 1.1.0

policies:
  caseFormat: gherkin
  caseLanguage: procedural
  preserveManualTag: true
  testIdRequired: true
  wrongBusinessDataSeverity: blocker
